version: '2'
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - tparallel
    - unconvert
    - unparam
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 25
    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - $gostd
            - github.com/cccteam
            - github.com/go-playground/errors/v5
            - github.com/google/go-cmp
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            # domain add asks Cloud Domains (the client, with its option package for the
            # quota project) and edits the placement with the HCL library and its value type.
            - cloud.google.com/go/domains
            # deploy record writes the deployment record to the records bucket.
            - cloud.google.com/go/storage
            # deploy resolve reads the build and mints its GitHub token through the Cloud
            # Build REST API with the process's default credentials.
            - golang.org/x/oauth2/google
            - google.golang.org/api/option
            - github.com/hashicorp/hcl/v2
            - github.com/zclconf/go-cty
            # secret pin asks Secret Manager whether the version it pins exists and is
            # enabled, through the same option package for the quota project, and lists
            # the containers and versions to choose from; it finds the environment
            # project by its labels through Cloud Resource Manager. Both clients page
            # their answers through the iterator package.
            - cloud.google.com/go/secretmanager
            - cloud.google.com/go/resourcemanager
            - google.golang.org/api/iterator
            # In the application layout the application is named by the module at the
            # repository root, read from its go.mod with the same parser impulse's
            # reader uses.
            - golang.org/x/mod/modfile
            # secret add tells a container Secret Manager does not know (NotFound, the
            # gRPC status of the client's error) from a refusal, and asks for the value at
            # the terminal without echo.
            - google.golang.org/grpc/codes
            - google.golang.org/grpc/status
            - golang.org/x/term
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 25
    godox:
      keywords:
        - TODO
        - BUG
    gomoddirectives:
      # The reader is read from impulse's working tree until its export is released.
      replace-local: true
    misspell:
      locale: US
    nestif:
      min-complexity: 10
    tagliatelle:
      case:
        rules:
          json: camel
        use-field-name: true
    wrapcheck:
      # Errors from the tool's own packages and from impulse's reader carry their own
      # context; wrapping them again would only prefix the user-facing message.
      ignore-package-globs:
        - github.com/cccteam/ccc/bedrock/*
        - github.com/cccteam/ccc/impulse/*
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .Cause(
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - linters:
          - funlen
          - gochecknoglobals
          - gochecknoinits
          - goconst
          - gocyclo
          - mnd
          - nlreturn
          - scopelint
          - gocognit
          - cyclop
          - nestif
          - prealloc
        path: _test\.go
      # render writes a stack a person applies and reads: 0755 directories and 0644
      # files are the conventional modes, not a leak. Writes go through an os.Root.
      - linters:
          - gosec
        path: internal/render/render\.go
        text: G30[16]
      # The role constants name what a variable is for; the one named after the
      # admin credentials holds the words, not a credential.
      - linters:
          - gosec
        path: internal/derive/derive\.go
        text: G101
      # Tests edit copies of the committed stack under their own temporary directory,
      # and build git repositories there for the migration renumber.
      - linters:
          - gosec
        path: _test\.go
        text: G(703|204)
      # The migration renumber asks git about the repository it runs in (the default
      # branch's tree, the tracked files) and moves tracked files with git mv: running
      # git with the repository's own paths is the command's purpose.
      - linters:
          - gosec
        path: internal/migration/git\.go
        text: G204
      # deploy resolve reads the build's id, project and location from the process
      # environment, as the pipeline sets them; its command test sets them with
      # t.Setenv, which forbids t.Parallel.
      - linters:
          - paralleltest
        path: internal/cli/cli_test\.go
        text: TestDeployResolve
      # The GitHub API's JSON is snake_case; the client and its stand-in write the
      # wire names as the API defines them.
      - linters:
          - tagliatelle
        path: internal/github/
      # tokenEnv names the variable a token is read from; it holds no token.
      - linters:
          - gosec
        path: internal/github/github\.go
        text: G101
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
