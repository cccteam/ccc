<div class="waystation-select">
  <mat-form-field appearance="outline">
    <mat-label>Waystation</mat-label>
    <mat-select [value]="ws.current()" (selectionChange)="ws.select($event.value)">
      @for (waystation of ws.waystations(); track waystation) {
        <mat-option [value]="waystation">{{ waystation }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-slide-toggle
    [checked]="ws.showAll()"
    (change)="ws.setShowAll($event.checked)"
    matTooltip="Demo affordance: include stations you hold no roles at, to watch every request refuse fail-closed. A real application would not offer this.">
    Show all waystations
  </mat-slide-toggle>
</div>
