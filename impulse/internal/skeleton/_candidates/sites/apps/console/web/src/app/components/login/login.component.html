<div class="login-page">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Sites</mat-card-title>
      <mat-card-subtitle>Sign in to continue</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="login()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Login</mat-label>
          <input matInput name="username" [(ngModel)]="username" autocomplete="username" required />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            name="password"
            type="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            required />
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="busy()">Sign in</button>
      </form>
      @if (failed()) {
        <p class="error">That login or password was not accepted.</p>
      }
      <p class="hint">
        Development logins: <code>admin</code> (every tenant) and <code>member</code> (north only), password
        <code>password</code>, created by <code>cmd/bootstrap</code> from <code>cmd/bootstrap/users.json</code>.
      </p>
    </mat-card-content>
  </mat-card>
</div>
