<div class="login-page">
  <mat-card class="login-card" [class.arriving]="methods.arriving()" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Sites Portal</mat-card-title>
      <mat-card-subtitle>The portal site: its own server, hostname, and browser application</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <ccc-login-methods #methods home="/dashboard" (signedIn)="go($event)" />
    </mat-card-content>
    <mat-card-footer class="release"><ccc-release /></mat-card-footer>
  </mat-card>
</div>
