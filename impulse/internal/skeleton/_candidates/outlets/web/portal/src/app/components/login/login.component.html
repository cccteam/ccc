<div class="login-page">
  <mat-card class="login-card" [class.arriving]="methods.arriving()" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Outlets Portal</mat-card-title>
      <mat-card-subtitle>The portal: a second browser application on the same site</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>
        Sign in with your organization account. The directory verifies who you are; the portal decides what you may do.
      </p>
      <ccc-login-methods #methods home="/dashboard" [labels]="labels" (signedIn)="go($event)" />
    </mat-card-content>
    <mat-card-footer class="release"><ccc-release /></mat-card-footer>
  </mat-card>
</div>
