<div class="header">
  <a class="brand" [routerLink]="['']">Outlets</a>
  <app-topbar></app-topbar>
  <div class="session">
    <!--
      The tenant picker: the tenants where the session holds a grant (user-domains). It
      shows the tenant the page is open in and sets none itself: choosing one opens the
      same page under that tenant's URL, and the guard on the tenant segment settles it.
    -->
    <mat-form-field appearance="outline" class="tenant" subscriptSizing="dynamic">
      <mat-label>Tenant</mat-label>
      <mat-select [value]="tenants.current()" (selectionChange)="tenants.open($event.value)">
        @for (tenant of tenants.tenants(); track tenant) {
          <mat-option [value]="tenant">{{ tenant }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <!--
      The feature flags dialog is the library's; the link shows under List on FeatureFlags,
      the dialog's read, and the digest decides inside the dialog whether the toggles work.
    -->
    <button mat-stroked-button class="flags" *cccHasPermission="flagsScope" (click)="openFeatureFlags()">
      Feature flags
    </button>
    <span class="username">{{ auth.sessionInfo().username }}</span>
    <a mat-stroked-button routerLink="/logout">Sign out</a>
  </div>
</div>
