# Every entry pins how dependabot writes its pull requests: the title becomes the squash
# commit's subject, and release-please releases a merge by its type. chore and build are
# hidden in our release configuration, so a bump merged under dependabot's inferred prefix
# never reached a release; "upgrade" is a visible patch section. A release is taken up only
# after it has been out a week, so a version pulled or superseded within days never lands.
# Dependabot version updates.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "upgrade"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "upgrade"
      include: "scope"
    cooldown:
